<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Authentication | E-Voting Platform</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260615">
</head>
<body>
    <nav>
        <a href="/" class="logo">
            <div class="logo-icon">🗳️</div>
            E-Voting Platform
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/pages/spectator/LiveCounting.html">Live Results</a>
            <a href="/pages/spectator/FinalResult.html">Final Tally</a>
        </div>
    </nav>

    <div class="container" style="max-width: 480px; margin-top: 3.5rem;">
        <div class="card" style="padding: 2.75rem 2.25rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="logo-icon" style="width: 56px; height: 56px; font-size: 1.8rem; margin: 0 auto 1rem auto;">🔐</div>
                <h2 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem;">Voter Authentication</h2>
                <p style="color: var(--text-secondary); font-size: 0.95rem;">Enter your Voter ID and password to access the digital ballot box.</p>
            </div>

            <div id="error-alert" class="alert alert-error" style="display: none;"></div>
            <div id="success-alert" class="alert alert-success" style="display: none;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="voterId">Voter ID</label>
                    <input type="text" id="voterId" placeholder="Enter your Voter ID (e.g. voter1)" required>
                </div>
                
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
                        <label for="password" style="margin-bottom: 0;">Password</label>
                        <a href="javascript:void(0)" id="toggle-pw" style="color: var(--primary); font-size: 0.8rem; text-decoration: none; font-weight: 600;">Show Password</a>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-full" style="font-size: 1rem; padding: 0.9rem;">
                    Sign In & Cast Vote ➔
                </button>
            </form>
            <p class="login-signup-link">New here? <a href="/pages/auth/Signup.html">Create a demo account</a></p>

            <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
                <span class="stat-label" style="font-size: 0.78rem;">⚡ Quick Demo Login Accounts (One-Click Auto Fill):</span>
                <div class="demo-pill-group">
                    <button type="button" class="demo-pill" onclick="fillDemo('voter1', 'password123')">👤 voter1 (Test Voter 1)</button>
                    <button type="button" class="demo-pill" onclick="fillDemo('voter2', '123456')">👤 voter2 (Test Voter 2)</button>
                    <button type="button" class="demo-pill" onclick="fillDemo('voter3', '123456')">👤 voter3 (Test Voter 3)</button>
                    <button type="button" class="demo-pill" onclick="fillDemo('TXPPS1893L', 'password123')">🪪 TXPPS1893L (PAN demo voter)</button>
                    <button type="button" class="demo-pill" onclick="fillDemo('admin1', 'admin123')">⚙️ admin1 (Admin)</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 E-Voting Platform. Secure JWT Authentication.</p>
    </footer>

    <script src="/js/main.js?v=20260615"></script>
    <script>
        function fillDemo(id, pw) {
            document.getElementById('voterId').value = id;
            document.getElementById('password').value = pw;
            showToast(`Auto-filled demo account: ${id}`, 'info');
        }

        const pwInput = document.getElementById('password');
        const togglePwBtn = document.getElementById('toggle-pw');

        togglePwBtn.addEventListener('click', () => {
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                togglePwBtn.innerText = 'Hide Password';
            } else {
                pwInput.type = 'password';
                togglePwBtn.innerText = 'Show Password';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const voterId = document.getElementById('voterId').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            const successAlert = document.getElementById('success-alert');
            const submitBtn = document.getElementById('submit-btn');

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = 'Authenticating...';

            try {
                const res = await fetch(apiUrl('/auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ voterId, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorAlert.innerText = '❌ ' + (data.error || data.message || 'Login failed');
                    errorAlert.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Sign In & Cast Vote ➔';
                    return;
                }

                setToken(data.token);
                successAlert.innerText = '✅ Authentication successful! Redirecting to ballot...';
                successAlert.style.display = 'flex';

                setTimeout(() => {
                    window.location.href = '/pages/voter/VotePage.html';
                }, 750);

            } catch (err) {
                errorAlert.innerText = '❌ Connection server error. Please make sure backend is running.';
                errorAlert.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In & Cast Vote ➔';
            }
        });
    </script>
</body>
</html>
