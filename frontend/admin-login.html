<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Navigation Bar (Matches Screenshot 1) -->
    <nav>
        <a href="/" class="logo">
            <div class="logo-img">
                <span style="color: #0B4F9C; font-weight: 900; font-size: 0.9rem;">voteadhikar</span>
            </div>
            Digital Voting System of India
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/pages/voter/Dashboard.html">Dashboard</a>
            <a href="/pages/spectator/LiveCounting.html">Results</a>
            <a href="/admin-login.html" class="active">Admin</a>
        </div>
    </nav>

    <div class="container" style="max-width: 480px; margin-top: 4rem;">
        <div class="card" style="padding: 2.5rem 3rem;">
            <h2 class="card-title">Admin Login</h2>

            <div id="error-alert" class="alert-box alert-danger" style="display: none;"></div>

            <form id="admin-login-form">
                <div class="form-group">
                    <input type="text" id="adminUsername" placeholder="Admin Username" required style="background: #E9ECEF;">
                </div>

                <div class="form-group">
                    <input type="password" id="adminSecretKey" placeholder="••••••••" required style="background: #E9ECEF;">
                </div>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <button type="submit" class="btn" style="padding: 0.5rem 1.75rem;">Login</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value;
            const secretKey = document.getElementById('adminSecretKey').value;
            const errorAlert = document.getElementById('error-alert');

            const walletAddress = window.voteInWallet?.account || null;

            try {
                const res = await fetch(apiUrl('/auth/admin-login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, secretKey, walletAddress })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorAlert.innerText = data.error || 'Admin authentication failed';
                    errorAlert.style.display = 'block';
                    return;
                }

                setToken(data.token);
                setUserRole('admin');
                window.location.href = '/admin.html';
            } catch (err) {
                errorAlert.innerText = 'Server connection error during admin sign in.';
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
