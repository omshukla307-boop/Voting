<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Top Navigation Bar (Matches Screenshots 2 & 4) -->
    <nav>
        <a href="/" class="logo">
            <div class="logo-img">
                <span style="color: #0B4F9C; font-weight: 900; font-size: 0.9rem;">voteadhikar</span>
            </div>
            Digital Voting System of India
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/pages/voter/VotePage.html">Vote</a>
            <a href="/pages/voter/Dashboard.html">Dashboard</a>
            <a href="/pages/spectator/LiveCounting.html">Results</a>
            <a href="/admin.html" class="active">Admin</a>

            <span class="header-status-badge">Ended | Admin Access</span>
            <span class="header-user-label">Administrator</span>
            <button id="logout-btn" class="header-logout-btn">Logout</button>
        </div>
    </nav>

    <div class="container" style="max-width: 900px; margin-top: 2.5rem;">
        <div class="card" style="border-top: 3px solid #28A745;">
            <h2 class="card-title">Election Management Panel</h2>

            <div id="admin-alert" class="alert-box alert-info" style="display: none;"></div>

            <!-- Section 1: Election Control (Matches Screenshot 2) -->
            <div style="margin-bottom: 2rem;">
                <h4 style="color: #0B4F9C; font-weight: 700; margin-bottom: 0.85rem;">Election Control</h4>
                
                <div class="inline-form-row">
                    <span id="control-status-badge" class="badge badge-not-started">Not Started</span>
                    <input type="text" id="ctrlElectionTitle" placeholder="Asmi" value="Asmi" required style="max-width: 320px;">
                    <select id="ctrlDuration" style="max-width: 180px;">
                        <option value="10">Duration (Mins)</option>
                        <option value="10" selected>10 Mins</option>
                        <option value="30">30 Mins</option>
                        <option value="60">60 Mins</option>
                    </select>
                    <button id="propose-blockchain-btn" class="btn" style="padding: 0.6rem 1.25rem;">Propose to Blockchain</button>
                </div>
            </div>

            <!-- Section 2: Pending Election Proposals (Matches Screenshot 2) -->
            <div style="margin-bottom: 2rem; border-top: 1px solid #E2E8F0; padding-top: 1.5rem;">
                <h4 style="color: #0B4F9C; font-weight: 700; margin-bottom: 0.85rem;">Pending Election Proposals</h4>
                
                <div id="proposals-loading" style="text-align: center; color: #6C757D; padding: 1rem;">
                    Loading...
                </div>
            </div>

            <!-- Section 3: Create Election (Matches Screenshot 2) -->
            <div style="border-top: 1px solid #E2E8F0; padding-top: 1.5rem;">
                <h4 style="color: #0B4F9C; font-weight: 700; margin-bottom: 1rem;">Create Election</h4>

                <form id="create-election-form">
                    <div class="form-group">
                        <input type="text" id="elTitle" placeholder="Election Title" required>
                    </div>

                    <div class="form-group" style="text-align: center;">
                        <select id="elType" style="max-width: 200px; display: inline-block;">
                            <option value="">Select Type</option>
                            <option value="national">National</option>
                            <option value="state">State</option>
                            <option value="local">Local</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <input type="text" id="elStartYear" placeholder="Start Year (YYYY)" required>
                    </div>

                    <div class="form-group">
                        <input type="text" id="elEndYear" placeholder="End Year (YYYY)" required>
                    </div>

                    <div style="text-align: center; margin-top: 1.25rem; display: flex; gap: 0.5rem; justify-content: center;">
                        <select id="elStatus" style="max-width: 140px;">
                            <option value="upcoming">Status</option>
                            <option value="live">Active</option>
                            <option value="ended">Ended</option>
                        </select>
                        <button type="submit" class="btn" style="padding: 0.55rem 1.5rem;">Save Election</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        const alertBox = document.getElementById('admin-alert');

        function showAlert(msg, type = 'info') {
            alertBox.className = `alert-box alert-${type}`;
            alertBox.innerText = msg;
            alertBox.style.display = 'block';
        }

        async function proposeBlockchain() {
            if (!window.voteInWallet?.account) {
                await window.voteInWallet?.connect();
            }

            const title = document.getElementById('ctrlElectionTitle').value || 'Asmi';
            const duration = document.getElementById('ctrlDuration').value || '10';

            showAlert(`Initiating Web3 Blockchain Proposal for election "${title}" (${duration} Mins)...`, 'info');

            try {
                const sig = await window.voteInWallet?.signBallot('ADMIN', 1, title, 1);
                if (sig) {
                    showAlert(`Blockchain Proposal Confirmed! Transaction Hash: ${sig.signature.slice(0, 24)}...`, 'success');
                    document.getElementById('proposals-loading').innerHTML = `
                        <div style="background: #D4EDDA; border: 1px solid #C3E6CB; color: #155724; padding: 0.75rem; border-radius: 4px;">
                            ✓ Proposal Confirmed on Blockchain: <strong>${title}</strong> (${duration} Mins) — Signature: ${sig.signature.slice(0, 16)}...
                        </div>
                    `;
                } else {
                    showAlert('Transaction request canceled by administrator.', 'danger');
                }
            } catch (err) {
                showAlert('Blockchain transaction failed.', 'danger');
            }
        }

        document.getElementById('propose-blockchain-btn').addEventListener('click', proposeBlockchain);

        document.getElementById('create-election-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('elTitle').value;
            const type = document.getElementById('elType').value || 'National';
            const start = document.getElementById('elStartYear').value || '2026';
            const end = document.getElementById('elEndYear').value || '2026';
            const token = getToken();

            try {
                const res = await fetch(apiUrl('/admin/create'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        name: title,
                        level: type,
                        startTime: new Date(`${start}-01-01`),
                        endTime: new Date(`${end}-12-31`)
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    showAlert(data.error || 'Failed to save election', 'danger');
                    return;
                }

                showAlert(`Election "${title}" saved successfully!`, 'success');
            } catch (err) {
                showAlert('Error creating election.', 'danger');
            }
        });
    </script>
</body>
</html>
